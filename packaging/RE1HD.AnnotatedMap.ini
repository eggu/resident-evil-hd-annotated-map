; RE1 HD Annotated Map - Survivor's Notes
; Install beside the plugin in <game folder>/scripts/ (scripts/RE1HD.AnnotatedMap.asi).
; Close the game before editing, save this file, then restart the game.
; Keep your existing INI when upgrading; settings changed in game are saved here automatically.

[AnnotatedMap]
; Settings format. Do not edit.
Version=4
; 1 = show annotations, 0 = hide them. In-game key: 0. Default: 1.
Enabled=1
; en = English, ko = Korean. In-game key: \ (the won sign on Korean keyboards). Default: en.
Language=en
; 0 = visited rooms, 1 = rooms revealed by a map, 2 = all rooms (spoilers). In-game key: 9. Default: 0.
Visibility=0
; Name size in percent, 50-150 in steps of 10. In-game keys: - and +. Default: 100.
NameSize=100
; Name opacity in percent, 10-100 in steps of 10. In-game keys: [ and ]. Default: 70.
NameOpacity=70
; Icon size in percent, 50-200 in steps of 10. In-game keys: the modifier with - and +. Default: 100.
IconSize=100
; Icon opacity in percent, 10-100 in steps of 10. In-game keys: the modifier with [ and ]. Default: 80.
IconOpacity=80
; Shift or Ctrl: the modifier for the icon size and opacity keys. Default: Shift.
Modifier=Shift
; Item names beside their icons: 0 = hidden, 1 = all, 2 = all except common items. In-game key: H (cycles 1, 2, 0). Default: 0.
ItemNames=0
; 1 = legend open, 0 = folded to one line. In-game key: ~. Default: 1.
Legend=1
; Center = a locked door's key on the door, Unvisited = in the room not visited yet. Default: Center.
DoorKey=Center
; Hidden groups, added together: 1 rooms, 2 locks, 4 puzzles, 16 key items, 32 files and maps, 64 events,
; 128 common items, 256 enemies. In-game keys: 1-8 switch them (1 rooms, 2 locks, 3 key items, 4 files and maps,
; 5 puzzles, 6 events, 7 common items, 8 enemies). Default 502 shows room names only (events are spoilers).
HiddenKinds=502
; 1 = show the minutes left beside Crimson Heads. In-game: hold 8 while enemies are on. Default: 0.
CrimsonTime=0

[Colors]
; One colour per category as #RRGGBB (the legend row, the names and the badges). A missing or unreadable value keeps the default.
; Saving settings in the game never changes this section or any comment. Defaults:
;Rooms=#F0E2BE
;Locks=#FFCD46
;KeyItems=#5ADCFF
;Files=#FF8CD2
;Puzzles=#FF9628
;Events=#B070FF
;CommonItems=#B8BCC4
;Enemies=#EB3C3C
